<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haftalık Plan</title>
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Plan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div class="splash">Yükleniyor…</div>
</div>

<dialog id="planDialog">
  <form id="planForm" method="dialog">
    <h2 id="planDialogTitle">Yeni plan</h2>
    <label>Ne yapacaksın?
      <input name="title" required maxlength="200" placeholder="ör. Okul, İHA işi, FPGA tasarımı">
    </label>
    <label>Tarih
      <input name="date" type="date" required>
    </label>
    <div class="row2">
      <label>Başlangıç <input name="start" type="time" required></label>
      <label>Bitiş <input name="end" type="time" required></label>
    </div>
    <label>Kategori
      <select name="category" id="categorySelect"></select>
    </label>
    <div>
      <label>Tekrar
        <select name="repeat">
          <option value="none">Tekrarlanmaz</option>
          <option value="daily">Her gün</option>
          <option value="weekdays">Hafta içi her gün</option>
          <option value="weekly">Her hafta</option>
          <option value="yearly">Her yıl</option>
        </select>
      </label>
      <label id="untilWrap">Şu tarihe kadar
        <input name="repeat_until" type="date">
      </label>
    </div>
    <label>Not
      <textarea name="note" rows="2" maxlength="1000" placeholder="İsteğe bağlı"></textarea>
    </label>
    <label class="toggle">
      <span class="txt"><b>Ekip de görsün</b><small>Kapalıysa bu planı sadece sen görürsün</small></span>
      <input name="share" type="checkbox">
      <span class="sw"></span>
    </label>
    <p class="hint" id="seriesHint" hidden>Bu tekrarlanan bir plan. Değişiklik ve silme tüm tekrarları etkiler.</p>
    <p class="error" id="planError" hidden></p>
    <div class="actions">
      <button type="button" class="btn danger" id="deletePlanBtn" hidden>Sil</button>
      <span class="spacer"></span>
      <button type="button" class="btn ghost" id="cancelPlanBtn">Vazgeç</button>
      <button type="submit" class="btn primary" id="savePlanBtn">Kaydet</button>
    </div>
  </form>
</dialog>

<dialog id="viewDialog">
  <div class="view-body" id="viewBody"></div>
  <div class="actions"><span class="spacer"></span><button type="button" class="btn primary" id="closeViewBtn">Tamam</button></div>
</dialog>

<dialog id="profileDialog">
  <form id="profileForm" method="dialog">
    <h2>Profil</h2>
    <label>Adın (ekip bunu görür)
      <input name="full_name" required maxlength="60">
    </label>
    <div class="hint" style="color:var(--text-2);font-weight:500;font-size:13px;margin:0">Rengin</div>
    <div class="swatches" id="swatches" style="margin-bottom:16px"></div>
    <div id="teamBox"></div>
    <p class="error" id="profileError" hidden></p>
    <div class="actions">
      <button type="button" class="btn danger" id="logoutBtn">Çıkış yap</button>
      <span class="spacer"></span>
      <button type="button" class="btn ghost" id="cancelProfileBtn">Vazgeç</button>
      <button type="submit" class="btn primary">Kaydet</button>
    </div>
  </form>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
